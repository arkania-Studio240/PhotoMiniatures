<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thumbnail Studio</title><meta name="theme-color" content="#1b1c1f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Luckiest+Guy&family=Permanent+Marker&family=Press+Start+2P&family=Russo+One&family=Black+Ops+One&family=Pacifico&family=Lobster&family=Righteous&family=Creepster&family=Oswald&family=Fredoka&family=Montserrat&display=swap"><link rel="stylesheet" href="styles.css"></head><body>

<main><aside id="left"><div class="tabs" id="ltabs"><button data-t="tpl" class="on">Plantillas</button><button data-t="els">Elementos</button><button data-t="tools">Pintar</button><button data-t="sel">Selección</button><button data-t="fx">Filtros</button><button data-t="bgs">Fondos</button><button data-t="ast">Assets</button><button data-t="view">Vista</button></div>
<div class="sec on" data-s="tpl"><div id="tpl" class="grid"></div></div>
<div class="sec" data-s="els"><div class="grid"><button data-add="rect">Rectángulo</button><button data-add="ellipse">Círculo</button><button data-add="text">Texto</button><button id="bUp">Subir imagen</button><button id="bPsd">Importar PSD</button><button data-shape="star">Estrella</button><button data-shape="tri">Triángulo</button><button data-shape="hex">Hexágono</button><button data-shape="diamond">Rombo</button><button data-shape="arrow">Flecha</button><button data-tool="pen">Pluma</button><button data-act="penclose">Cerrar forma</button><button data-act="penopen">Terminar abierta</button></div></div>

<div class="sec" data-s="ast"><div id="assets" class="grid"></div></div>
